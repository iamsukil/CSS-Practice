<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div>h1:first-child{
            color:blue;
            background-color:black;
            text-align: center;
        }
        div>p:last-child{
            color:green;
            background-color:black;
            text-align:center;
        }
        #demo>h1:nth-child(2){
            color:yellow;
            background-color:black;
            text-align: center;
    </style>
    
</head>
<body>
    <!-- FIRST CHILD & LAST CHILD -->
     <div>
        <h1>Sukil</h1>
        <p>Vishinu</p>
        <h2>Hari</h2>
        <p>Shelton</p>
        <h1>Mahi</h1>
     </div>

     <hr>

     <div>
        <h1>Vaishu</h1>
        <p>Pranav</p>
        <h2>Ananya</h2>
        <p>Aidti</p>
        <h1>Adhav</h1>
        <p>Arjun</p>
     </div>

     <!--nth CHILD -->
     <div id="demo">
       <h1>Fleming</h1>
       <h1>Meclum</h1>
       <h1>Ravi shastri</h1>
       <h1>Victory</h1>
     </div>
    
</body>
</html>
