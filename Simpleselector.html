<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #demo1{
            color: aqua;
            background-color: bisque;
            text-align: center;
        }
        #demo2{
            color:blanchedalmond;
            background-color: chartreuse;
            text-align: center;
        }
        #demo3{
            color: coral;
            background-color: bisque;
            text-align: center;
        }
        #demo4{
            color: beige;
            background-color: darkmagenta;
            text-align: center;
        }
        .cls{
            color: beige;
            background-color: blue;
            text-align: center;
        }
        h1,p,h4{
            color: blueviolet;
            background-color: darkturquoise;
            text-align: center;
        }
        *{
            color: white;
            background-color: red;
            text-align: center;
        }
    </style>
</head>
<body>
    
     <!-- id(#) -->
      <h1 id="demo1">HTML</h1>
      <h1 id="demo2">CSS</h1>
      <h1 id="demo3">JS</h1>
      <h1 id="demo4">ANGULAR</h1>
      <hr>

      <!-- CLASS(.) -->
       <h1 class="cls">Sukil</h1>
       <p class="cls">Vaishu</p>
       <h2 class="cls">Hari</h2>
       <div class="cls">Vishnu</div>
       <hr>

       <!-- TagName -->
        <h1>USA</h1>
        <h2>UK</h2>
        <h3>FRANCE</h3>
        <hr>

        <!-- Groupping -->
         <h1>MESSI</h1>
         <p>RONALDO</p>
         <h4>NEYMAR</h4>
         <hr>

         <!-- Universal  -->
          <h1>Dhoni</h1>
          <h3>Sanju</h3>
          <p>Rohit</p>
</body>
</html>
